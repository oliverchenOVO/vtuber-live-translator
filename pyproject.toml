[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vtuber-live-translator"
version = "0.1.0"
description = "Windows live transcript studio for Vtuber streams"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vtuber-live-translator = "vlt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vlt = ["ui/qml/*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

