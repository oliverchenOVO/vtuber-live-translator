[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vtuber-live-translator"
version = "0.3.0"
description = "Windows live transcript studio for Vtuber streams"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "comtypes>=1.4,<2",
    "pycaw>=20251023",
    "psutil>=6,<8",
    "numpy>=2,<3",
    "soxr>=1,<2",
    "faster-whisper>=1.2,<2",
    "ctranslate2>=4,<5",
    "webrtcvad-wheels>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vtuber-live-translator = "vlt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vlt = ["ui/qml/*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
